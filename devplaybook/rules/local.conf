# ============================================================
# local.conf — 本项目定制规则（S3 项目标准，永不覆盖）
# 格式: 规则名称|搜索模式|排除模式
# 约束: 模式内禁止裸 |（与分隔符冲突）；需要"或"时拆成多条规则
#
# 引擎指令行（以 @ 开头，不参与规则匹配）:
#   @lang=*.swift          覆盖本 conf 的 grep 语言模式（默认取各栈 conf）
#   @dir=app/             限定本 conf 规则只扫描该目录（默认扫描整个项目）
#   @commit-types=feat|fix   覆盖 commit-msg hook 的 type 集合（默认见 COMMIT_GUIDE）
#   @pretest=flutter test    声明提交前必跑命令（hook 提交前自动执行，注意耗时）
# ============================================================

@lang=*.swift

# ADR-002/004：配置与文件 IO 只能经 SettingsStore / FileIOService，视图层禁止直接做
view_layer_file_io|String[(]contentsOf|Services/|Models/|test/
view_layer_bytes_io|Data[(]contentsOf|Services/|Models/|test/
scattered_userdefaults|UserDefaults[.]standard|SettingsStore[.]swift|test/

# ADR-006：编辑器配色必须走 EditorTheme token
scattered_editor_color|NSColor[(]|EditorTheme[.]swift|test/
